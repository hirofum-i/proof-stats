name: update-stats
on:
  schedule:
    - cron: "13 * * * *"   # 毎時13分（JST/UTC問わず毎時）
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: update-stats
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python build_proof_stats.py
        env:
          SYSTEME_API_KEY: ${{ secrets.SYSTEME_API_KEY }}
      # 履歴を残さず単一コミットを上書き（推移データを外部に晒さない）
      - run: |
          git config user.name "proof-bot"
          git config user.email "actions@users.noreply.github.com"
          git add stats.json
          git commit --amend --no-edit
          git push --force origin main
